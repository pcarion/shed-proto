syntax = "proto3";

package sidecar.v1;

option go_package = "github.com/pcarion/shed-proto/gen/go/sidecar/v1;sidecarv1";

// Sidecar is the service exposed by the shed-sidecar daemon running on Ubuntu
// VMs managed via Hetzner. Clients connect through SSH tunnels using
// insecure.NewCredentials() — TLS is not used because the tunnel provides the
// transport security.
service Sidecar {
  // ServiceStatus returns the systemd status for one or more services.
  rpc ServiceStatus(ServiceStatusRequest) returns (ServiceStatusResponse);
  // PasswordGet returns an existing password or creates a new one.
  rpc PasswordGet(PasswordGetRequest) returns (PasswordGetResponse);
  // PasswordRead returns a stored password without creating it.
  rpc PasswordRead(PasswordReadRequest) returns (PasswordReadResponse);
  // PasswordList returns all stored passwords grouped by service name.
  rpc PasswordList(PasswordListRequest) returns (PasswordListResponse);
}

enum PasswordType {
  PASSWORD_TYPE_UNSPECIFIED = 0;
  // PASSWORD_TYPE_LOWERCASE uses lowercase letters (a).
  PASSWORD_TYPE_LOWERCASE = 1;
  // PASSWORD_TYPE_UPPERCASE uses uppercase letters (A).
  PASSWORD_TYPE_UPPERCASE = 2;
  // PASSWORD_TYPE_DIGIT uses digits (1).
  PASSWORD_TYPE_DIGIT = 3;
  // PASSWORD_TYPE_SYMBOL uses symbols (#).
  PASSWORD_TYPE_SYMBOL = 4;
  // PASSWORD_TYPE_HEX_LOWER uses lowercase hexadecimal characters (h).
  PASSWORD_TYPE_HEX_LOWER = 5;
  // PASSWORD_TYPE_HEX_UPPER uses uppercase hexadecimal characters (H).
  PASSWORD_TYPE_HEX_UPPER = 6;
  // PASSWORD_TYPE_UUID_V7 generates a UUIDv7 value (u7).
  PASSWORD_TYPE_UUID_V7 = 7;
}

message ServiceStatusRequest {
  // services is the list of systemd unit names to query (e.g. "nginx.service").
  repeated string services = 1;
  // include_raw requests the full `systemctl status` output in each status.
  bool include_raw = 2;
}

message ServiceStatusResponse {
  repeated ServiceStatus statuses = 1;
}

// ServiceStatus mirrors the fields returned by systemctl show / D-Bus
// org.freedesktop.systemd1 for a single unit.
message ServiceStatus {
  string name = 1;
  string load_state = 2;
  string active_state = 3;
  string sub_state = 4;
  string description = 5;
  int64 main_pid = 6;
  // raw holds the full `systemctl status` output; omitted when not requested.
  optional string raw = 7;
}

message PasswordGetRequest {
  // service_name is the name of the service requesting a password.
  string service_name = 1;
  // name is the name of the password.
  string name = 2;
  // length is the desired password length.
  int32 length = 3;
  // type controls how the password is generated.
  PasswordType type = 4;
}

message PasswordGetResponse {
  string password = 1;
  // is_new is true when the password was just created.
  bool is_new = 2;
}

message PasswordReadRequest {
  // service_name is the name of the service requesting a password.
  string service_name = 1;
  // name is the name of the password.
  string name = 2;
}

message PasswordReadResponse {
  string password = 1;
  // is_ok is false when no password is found.
  bool is_ok = 2;
}

message PasswordListRequest {}

message PasswordListResponse {
  // services is ordered alphabetically by service_name.
  repeated PasswordService services = 1;
}

message PasswordService {
  string service_name = 1;
  // passwords is ordered alphabetically by name.
  repeated PasswordEntry passwords = 2;
}

message PasswordEntry {
  string name = 1;
  string password = 2;
}
